<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left red accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#8B1E1E"/>

  <!-- Center content block — vertically centered around y=315 -->

  <!-- TAHMİN LİGİ label -->
  <text x="600" y="168" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="13" letter-spacing="7" fill="#8B1E1E" text-anchor="middle">TAHMİN LİGİ</text>

  <!-- Main title -->
  <text x="600" y="280" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="130" letter-spacing="-2" fill="#FFFFFF" text-anchor="middle">TRİBÜN</text>

  <!-- Divider line -->
  <rect x="260" y="298" width="680" height="3" fill="#8B1E1E"/>

  <!-- Subtitle -->
  <text x="600" y="346" font-family="Arial, sans-serif" font-size="21" fill="#666666" text-anchor="middle">Arkadaşlarınla futbol tahmin ligi kur, skor tahmin et.</text>

  <!-- Scoring cards — centered -->
  <g transform="translate(309, 390)">
    <!-- Card 1: 3 pts -->
    <rect x="0" y="0" width="170" height="110" rx="4" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
    <rect x="0" y="0" width="170" height="3" fill="#C9A84C"/>
    <text x="85" y="66" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="#C9A84C" text-anchor="middle">3</text>
    <text x="85" y="92" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#555555" text-anchor="middle">TAM SKOR</text>

    <!-- Card 2: 1 pt -->
    <rect x="191" y="0" width="170" height="110" rx="4" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
    <rect x="191" y="0" width="170" height="3" fill="#7C4A2D"/>
    <text x="276" y="66" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="#7C4A2D" text-anchor="middle">1</text>
    <text x="276" y="92" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#555555" text-anchor="middle">SONUÇ</text>

    <!-- Card 3: 0 pts -->
    <rect x="382" y="0" width="170" height="110" rx="4" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
    <rect x="382" y="0" width="170" height="3" fill="#333333"/>
    <text x="467" y="66" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="#444444" text-anchor="middle">0</text>
    <text x="467" y="92" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#555555" text-anchor="middle">YANLIŞ</text>
  </g>

  <!-- Domain bottom center -->
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" fill="#2A2A2A" text-anchor="middle">tribun.furunci.tech</text>

  <!-- Subtle corner decoration -->
  <g opacity="0.04">
    <text x="1160" y="580" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="480" fill="#FFFFFF" text-anchor="end">T</text>
  </g>
</svg>
